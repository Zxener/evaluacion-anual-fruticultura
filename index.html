<script>
const get = id => document.getElementById(id);
const exam = get('exam');
const storeKey = 'unahur-fruticultura-evaluacion-anual-v1';
const unbase64 = value => Uint8Array.from(atob(value), c => c.charCodeAt(0));
const esc = value => value.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let saved = {};
try { saved = JSON.parse(localStorage.getItem(storeKey) || '{}') || {}; } catch {}
function render(questions) {
  const index = questions.map(({id}) => '<li><a aria-label="Pregunta '+id+'" href="#p'+id+'">'+id+'</a></li>').join('');
  const html = questions.map(q => {
    const id = q.id;
    const prompt = id + '. ' + esc(q.prompt);
    const options = q.options?.map((option,n)=>'<label><input type="radio" name="q'+id+'" value="'+n+'"> '+ 'ABCD'[n] + '. '+esc(option)+'</label>').join('');
    const uncertain = [45,55].includes(id);
    const solution = '<details class="solution"><summary>'+ (q.options ? 'Ver respuesta justificada' : 'Ver respuesta modelo') +'</summary>' +
      (q.options ? '<p><strong>'+ (uncertain ? 'Respuesta probable · ' : '') + 'ABCD'[q.answer]+'. '+esc(q.options[q.answer])+'</strong></p>' : '')+
      '<p>'+esc(q.reason)+'</p></details>';
    return options
      ? '<fieldset class="question" id="p'+id+'"><legend>'+prompt+'</legend>'+options+'<p class="feedback" hidden></p>'+solution+'</fieldset>'
      : '<section class="question" id="p'+id+'"><h3>'+prompt+'</h3><label for="text'+id+'">Tu borrador</label><textarea id="text'+id+'" name="q'+id+'" rows="4"></textarea>'+solution+'</section>';
  }).join('');
  exam.innerHTML = '<nav class="bar" aria-label="Navegación"><strong id="progress" aria-live="polite"></strong><a href="#indice">Índice</a><a href="#p81">Desarrollo</a><a class="action" href="#resultado">Corregir</a></nav>'+
    '<header class="panel"><p class="eyebrow">UNAHUR · Tecnicatura Universitaria en Viverismo</p><h1>EVALUACIÓN ANUAL</h1><h2>Fruticultura</h2><p class="credit">Universidad Nacional de Hurlingham · Carlos Arturo d’Albuquerque</p><p class="credit">80 preguntas de opción múltiple y cuatro de desarrollo. Respondé y abrí la justificación de cada pregunta, o corregí juntas las de opción múltiple. Tus marcas y borradores se guardan en este navegador.</p></header>'+
    '<nav class="panel module" id="indice"><h2>Índice</h2><ol class="index">'+index+'</ol></nav><form id="questions" class="panel">'+html+
    '<section class="finish" id="resultado"><h2>Resultado</h2><p id="score" role="status">Las cuatro respuestas de desarrollo se comparan con los modelos.</p><div class="row"><button id="grade" type="button">Corregir las 80 preguntas</button><button id="show" class="secondary" type="button">Abrir todas las soluciones</button></div></section></form>'+
    '<section class="panel sources"><h2>Fuentes de consulta</h2><ul><li><a href="https://courses.cit.cornell.edu/hort494/mg/specific.grafting/AppleRSLeft.html">Cornell University · Portainjertos de manzano</a></li><li><a href="https://content.ces.ncsu.edu/growing-pecans-in-north-carolina">NC State Extension · Cultivo de pecán</a></li><li><a href="https://cappecan.com.ar/wp-content/uploads/2023/11/MANUAL_ETAPAS-FENOLOGICAS-DEL-MONTE-DE-PECAN_ING-MARIANO-MARCO_compressed.pdf">Cámara Argentina de Productores de Pecán · Etapas fenológicas</a></li><li><a href="https://www.argentina.gob.ar/senasa/micrositios/hlb">SENASA · HLB</a></li></ul></section>';
  const form=get('questions');
  const closed=questions.filter(q=>q.options);
  let graded=false;
  for(const input of form.querySelectorAll('input')) input.checked=saved[input.name]===input.value;
  for(const input of form.querySelectorAll('textarea')) input.value=saved[input.name] || '';
  function update(){
    const answered=closed.filter(q=>['0','1','2','3'].includes(saved['q'+q.id]));
    get('progress').textContent=answered.length+' de 80 respondidas';
    if(!graded)return;
    const correct=answered.filter(q=>saved['q'+q.id]===String(q.answer)).length;
    get('score').textContent=correct+' de 80 según la guía · '+(80-answered.length)+' sin responder. Desarrollo: comparación con los modelos.';
    for(const q of closed){
      const value=saved['q'+q.id];
      const feedback=get('p'+q.id).querySelector('.feedback');
      feedback.hidden=false;
      feedback.classList.toggle('incorrect',value!==String(q.answer));
      feedback.textContent=(value===undefined?'Sin responder':value===String(q.answer)?'Coincide con la guía':'Revisá tu elección')+' · '+([45,55].includes(q.id)?'Opción probable: ':'Respuesta: ')+'ABCD'[q.answer];
    }
  }
  form.addEventListener('input',({target})=>{
    if(!target.name)return;
    saved[target.name]=target.value;
    try { localStorage.setItem(storeKey, JSON.stringify(saved)); } catch {}
    update();
  });
  get('grade').onclick=()=>{graded=true;update();};
  get('show').onclick=()=>{
    const open=get('show').textContent==='Abrir todas las soluciones';
    for(const details of form.querySelectorAll('details'))details.open=open;
    get('show').textContent=open?'Cerrar todas las soluciones':'Abrir todas las soluciones';
  };
  update();
  get('gate').hidden=true;
  exam.hidden=false;
  get(location.hash.slice(1))?.scrollIntoView();
}
get('access').addEventListener('submit',async event=>{
  event.preventDefault();
  const button=event.currentTarget.querySelector('button');
  button.disabled=true;
  get('error').textContent='';
  try {
    const [salt,iv,sealed]=get('pack').textContent.split('.').map(unbase64);
    const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(get('pin').value.trim()),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:325000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);
    let clear;
    try { clear=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,sealed); }
    catch {get('error').textContent='Clave incorrecta. Volvé a intentarlo.';get('pin').select();return;}
    render(JSON.parse(new TextDecoder().decode(clear)));
    get('pin').value='';
  } catch {get('error').textContent='No se pudo abrir la evaluación. Recargá la página para volver a intentar.';}
  finally {button.disabled=false;}
});
</script>
</body>
